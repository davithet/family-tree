<style>

    position:fixed;

    right:15px;

    bottom:62px;

    z-index:99999;

<script>

/* =========================================================
   USERNAME / PASSWORD
   აქ შეგიძლია შეცვალო შესვლის მონაცემები
========================================================= */

const FAMILY_SECURITY_USERNAME = "vano";

const FAMILY_SECURITY_PASSWORD = "suja";


/* =========================================================
   LOGIN SCREEN
========================================================= */

(function(){

    function createLoginScreen(){

        if(document.getElementById("familyLoginScreen"))
            return;


        const screen=document.createElement("div");

        screen.id="familyLoginScreen";


        screen.innerHTML=`

            <div id="familyLoginBox">

                <div id="familyLoginLogo">
                    🌳
                </div>

                <div id="familyLoginTitle">
                    Family Tree V11
                </div>

                <div id="familyLoginSubtitle">
                    🔐 უსაფრთხო ოჯახის სივრცე
                </div>


                <input
                    id="familyLoginUsername"
                    class="familyLoginInput"
                    type="text"
                    placeholder="👤 Username"
                    autocomplete="username"
                >


                <input
                    id="familyLoginPassword"
                    class="familyLoginInput"
                    type="password"
                    placeholder="🔑 Password"
                    autocomplete="current-password"
                >


                <button
                    id="familyLoginButton"
                    type="button"
                >
                    🔐 შესვლა
                </button>


                <div id="familyLoginError"></div>

            </div>

        `;


        document.body.appendChild(screen);


        document
        .getElementById("familyLoginButton")
        .onclick=checkLogin;


        document
        .getElementById("familyLoginPassword")
        .addEventListener(
            "keydown",
            function(e){

                if(e.key==="Enter"){
                    checkLogin();
                }

            }
        );


        document
        .getElementById("familyLoginUsername")
        .addEventListener(
            "keydown",
            function(e){

                if(e.key==="Enter"){

                    document
                    .getElementById("familyLoginPassword")
                    .focus();

                }

            }
        );


        setTimeout(function(){

            document
            .getElementById("familyLoginUsername")
            ?.focus();

        },100);

    }


    /* =====================================================
       CHECK LOGIN
    ===================================================== */

    function checkLogin(){

        const username=
            document
            .getElementById("familyLoginUsername")
            .value
            .trim();


        const password=
            document
            .getElementById("familyLoginPassword")
            .value;


        const error=
            document
            .getElementById("familyLoginError");


        if(
            username===FAMILY_SECURITY_USERNAME &&
            password===FAMILY_SECURITY_PASSWORD
        ){

            sessionStorage.setItem(
                "familyTreeV11_loggedIn",
                "true"
            );

            sessionStorage.setItem(
                "familyTreeV11_user",
                username
            );


            unlockFamilyTree();

        }
        else{

            error.textContent=
                "❌ Username ან Password არასწორია.";

            document
            .getElementById("familyLoginPassword")
            .value="";

            document
            .getElementById("familyLoginPassword")
            .focus();

        }

    }


    /* =====================================================
       UNLOCK
    ===================================================== */

    function unlockFamilyTree(){

        const screen=
            document.getElementById(
                "familyLoginScreen"
            );


        if(screen){

            screen.remove();

        }


        document.body.style.overflow="";


        createLogoutButton();

    }


    /* =====================================================
       LOGOUT BUTTON
    ===================================================== */

    function createLogoutButton(){

        let btn=
            document.getElementById(
                "familyLogoutButton"
            );


        if(!btn){

            btn=document.createElement("button");

            btn.id=
                "familyLogoutButton";

            btn.innerHTML=
                "🔒 გამოსვლა";

            btn.onclick=
                familyLogout;

            document.body.appendChild(btn);

        }


        let user=
            document.getElementById(
                "familySecurityUser"
            );


        if(!user){

            user=document.createElement("div");

            user.id=
                "familySecurityUser";

            document.body.appendChild(user);

        }


        const username=
            sessionStorage.getItem(
                "familyTreeV11_user"
            ) || FAMILY_SECURITY_USERNAME;


        user.textContent=
            "👤 "+username;


        btn.style.display="block";

        user.style.display="block";

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    function familyLogout(){

        if(
            !confirm(
                "ნამდვილად გსურთ გამოსვლა?"
            )
        )
            return;


        sessionStorage.removeItem(
            "familyTreeV11_loggedIn"
        );

        sessionStorage.removeItem(
            "familyTreeV11_user"
        );


        const btn=
            document.getElementById(
                "familyLogoutButton"
            );

        if(btn)
            btn.style.display="none";


        const user=
            document.getElementById(
                "familySecurityUser"
            );

        if(user)
            user.style.display="none";


        createLoginScreen();

    }


    /* =====================================================
       START SECURITY
    ===================================================== */

    function startSecurity(){

        const loggedIn=
            sessionStorage.getItem(
                "familyTreeV11_loggedIn"
            );


        if(
            loggedIn==="true"
        ){

            createLogoutButton();

        }
        else{

            document.body.style.overflow="hidden";

            createLoginScreen();

        }

    }


    /* =====================================================
       GLOBAL LOGOUT FUNCTION
    ===================================================== */

    window.familyLogout=
        familyLogout;


    /* =====================================================
       START
    ===================================================== */

    if(document.readyState==="loading"){

        document.addEventListener(
            "DOMContentLoaded",
            startSecurity
        );

    }
    else{

        startSecurity();

    }

})();

</script>

<script>

/* =====================================================
   DATABASE
===================================================== */

let people=[];
let relations=[];

let selectedPerson=null;


/* =====================================================
   ID
===================================================== */

function makeId(){

    return Date.now().toString(36)
    +
    Math.random()
    .toString(36)
    .substring(2,9);

}


/* =====================================================
   STORAGE
===================================================== */

function saveData(){

    localStorage.setItem(
        "familyTreeV4_people",
        JSON.stringify(people)
    );

    localStorage.setItem(
        "familyTreeV4_relations",
        JSON.stringify(relations)
    );

}


function loadData(){

    let p=
        localStorage.getItem(
            "familyTreeV4_people"
        );

    let r=
        localStorage.getItem(
            "familyTreeV4_relations"
        );


    if(p){

        try{

            people=JSON.parse(p);

        }
        catch(e){

            people=[];

        }

    }


    if(r){

        try{

            relations=JSON.parse(r);

        }
        catch(e){

            relations=[];

        }

    }


    if(!people.length){

        createDemo();

    }


    selectedPerson=
        people.length
        ? people[0].id
        : null;


    renderTree();

}

/* =====================================================
   PERSON OBJECT
===================================================== */

function createPersonObject(
    first,
    last,
    birth,
    birthPlace,
    death,
    deathPlace
){

    let p={

        id:makeId(),

        firstName:first,

        lastName:last,

        birthDate:birth,

        birthPlace:birthPlace,

        deathDate:death,

        deathPlace:deathPlace,

        gender:"",

        photo:"",

        notes:""

    };


    people.push(p);

    return p;

}


/* =====================================================
   GET PERSON
===================================================== */

function getPerson(pid){

    return people.find(
        p=>p.id===pid
    );

}


/* =====================================================
   AGE CALCULATION
===================================================== */
function parseDateValue(value){
    if(!value) return null;
    let v=String(value).trim();
    let m=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
    if(m) return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
    m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);
    if(m) return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));
    let d=new Date(v);
    return isNaN(d.getTime()) ? null : d;
}
function calculateAge(birth,endDate){
    let b=parseDateValue(birth);
    if(!b) return null;

    // endDate may be a Date object OR a stored date string.
    // Always normalize it before calling getFullYear/getMonth/getDate.
    let e;
    if(endDate instanceof Date){
        e=endDate;
    }else if(endDate){
        e=parseDateValue(endDate);
    }else{
        e=new Date();
    }
    if(!e || isNaN(e.getTime())) return null;

    let age=e.getFullYear()-b.getFullYear();
    if(e.getMonth()<b.getMonth() || (e.getMonth()===b.getMonth() && e.getDate()<b.getDate())) age--;
    return age>=0 ? age : null;
}
function ageText(p){
    if(!p.birthDate) return 'ასაკი: უცნობია';
    let end=p.deathDate ? parseDateValue(p.deathDate) : null;
    let age=calculateAge(p.birthDate,end);
    if(age===null) return 'ასაკი: უცნობია';
    return p.deathDate ? 'გარდაცვალების ასაკი: '+age+' წელი' : 'დღევანდელი ასაკი: '+age+' წელი';
}

/* =====================================================
   NAME
===================================================== */

function fullName(p){

    if(!p)
        return "";

    return (
        p.firstName+
        " "+
        (p.lastName||"")
    ).trim();

}


/* =====================================================
   RELATION
===================================================== */

function getRelations(
    pid,
    type
){

    return relations

    .filter(
        r=>
        r.a===pid &&
        r.type===type
    )

    .map(
        r=>r.b
    );

}


/* =====================================================
   ADD RELATION
===================================================== */

function addRelation(
    a,
    type,
    b
){

    if(
        relations.some(
            r=>
            r.a===a &&
            r.b===b &&
            r.type===type
        )
    )
        return;


    relations.push({

        id:makeId(),

        a:a,

        type:type,

        b:b

    });


    /*
       ავტომატური უკუკავშირი
    */

    let reverse={

        "მამა":"შვილი",

        "დედა":"შვილი",

        "შვილი":"მშობელი",

        "მეუღლე":"მეუღლე",

        "პაპა":"შვილიშვილი",

        "ბებია":"შვილიშვილი",

        "შვილიშვილი":"პაპა",

        "ძმა":"ძმა",

        "და":"და",

        "ბიძა":"ძმისშვილი",

        "დეიდა":"დისშვილი",

        "ბიძაშვილი":"ბიძაშვილი"

    };


    let rev=
        reverse[type];


    /*
       მშობლის კავშირი სპეციალურად
       განვიხილოთ
    */

    if(
        type==="მამა" ||
        type==="დედა"
    ){

        addRelation(
            b,
            "შვილი",
            a
        );

        return;

    }


    if(type==="შვილი"){

        /*
           თუ პირდაპირი მშობლის ტიპი
           უცნობია, მხოლოდ შვილის
           კავშირი ვინახავთ.
        */

        return;

    }


    if(rev){

        if(
            !relations.some(
                r=>
                r.a===b &&
                r.type===rev &&
                r.b===a
            )
        ){

            relations.push({

                id:makeId(),

                a:b,

                type:rev,

                b:a

            });

        }

    }

}


/* =====================================================
   ANCESTORS
===================================================== */

function findAncestors(root){

    let result=[];

    let queue=[
        {
            id:root,
            level:0
        }
    ];

    let visited=new Set();


    while(queue.length){

        let current=
            queue.shift();


        if(
            visited.has(
                current.id
            )
        )
            continue;


        visited.add(
            current.id
        );


        let parentRelations=
            relations.filter(
                r=>
                r.b===current.id &&
                (
                    r.type==="შვილი" ||
                    r.type==="ვაჟიშვილი" ||
                    r.type==="ქალიშვილი" ||
                    r.type==="მშობელი"
                )
            );


        parentRelations.forEach(r=>{

            let parent=
                r.a;


            if(
                parent &&
                parent!==current.id
            ){

                result.push({

                    id:parent,

                    level:
                    current.level-1

                });


                queue.push({

                    id:parent,

                    level:
                    current.level-1

                });

            }

        });

    }


    /*
       პირდაპირი მამა/დედა
    */

    relations
    .filter(
        r=>
        r.a===root &&
        (
            r.type==="მამა" ||
            r.type==="დედა"
        )
    )
    .forEach(r=>{

        result.push({

            id:r.b,

            level:-1

        });

    });


    return result;

}


/* =====================================================
   DESCENDANTS
===================================================== */

function findDescendants(root){

    let result=[];

    let queue=[
        {
            id:root,
            level:0
        }
    ];

    let visited=new Set();


    while(queue.length){

        let current=
            queue.shift();


        if(
            visited.has(
                current.id
            )
        )
            continue;


        visited.add(
            current.id
        );


        let children=
            relations.filter(
                r=>
                r.a===current.id &&
                (r.type==="შვილი" ||
                 r.type==="ვაჟიშვილი" ||
                 r.type==="ქალიშვილი")
            );


        children.forEach(r=>{

            result.push({

                id:r.b,

                level:
                current.level+1

            });


            queue.push({

                id:r.b,

                level:
                current.level+1

            });

        });

    }


    return result;

}


/* =====================================================
   RENDER TREE
===================================================== */

function renderTree(){

    updateV8Stats();

    let tree=
        document.getElementById(
            "tree"
        );

    let svg=
        document.getElementById(
            "lines"
        );


    tree
    .querySelectorAll(
        ".person"
    )
    .forEach(
        x=>x.remove()
    );


    svg.innerHTML="";


    if(!selectedPerson)
        return;


    let root=
        getPerson(
            selectedPerson
        );


    if(!root)
        return;


    let levels={};


    levels[0]=[
        root.id
    ];


    /*
       წინაპრები
    */

    findAncestors(
        root.id
    )
    .forEach(x=>{

        if(
            !levels[x.level]
        )
            levels[x.level]=[];


        if(
            !levels[x.level]
            .includes(x.id)
        )
            levels[x.level]
            .push(x.id);

    });


    /*
       შთამომავლები
    */

    findDescendants(
        root.id
    )
    .forEach(x=>{

        if(
            !levels[x.level]
        )
            levels[x.level]=[];


        if(
            !levels[x.level]
            .includes(x.id)
        )
            levels[x.level]
            .push(x.id);

    });


    /*
       მეუღლე
    */

    getRelations(
        root.id,
        "მეუღლე"
    )
    .forEach(pid=>{

        if(
            !levels[0]
            .includes(pid)
        ){

            levels[0]
            .push(pid);

        }

    });


    let keys=
        Object.keys(levels)
        .map(Number)
        .sort(
            (a,b)=>a-b
        );


    let minLevel=
        Math.min(...keys);


    let maxLevel=
        Math.max(...keys);


    let W=210;
    let H=135;

    let GAP=55;

    let WIDTH=2200;

    let positions={};


    /*
       ბარათების განლაგება
    */

    keys.forEach(level=>{

        let list=
            levels[level];


        let total=
            list.length*W+
            Math.max(
                0,
                list.length-1
            )*GAP;


        let start=
            Math.max(
                30,
                (WIDTH-total)/2
            );


        list.forEach(
            (pid,index)=>{

                let x=
                    start+
                    index*(W+GAP);


                let y=
                    80+
                    (
                        level-minLevel
                    )*210;


                positions[pid]={

                    x:x,

                    y:y

                };


                let p=
                    getPerson(pid);


                if(!p)
                    return;


                let box=
                    document.createElement(
                        "div"
                    );


                box.className=
                    "person "+
                    (
                        pid===root.id
                        ?"root"
                        :""
                    );


                box.style.left=
                    x+"px";


                box.style.top=
                    y+"px";


                let photoHTML;


                if(p.photo){

                    photoHTML=`

                    <img
                    class="photo"
                    src="${p.photo}"
                    onclick="
                    openPersonMenu(
                    event,
                    '${pid}'
                    )">

                    `;

                }
                else{

                    photoHTML=`

                    <div
                    class="noPhoto"
                    onclick="
                    openPersonMenu(
                    event,
                    '${pid}'
                    )">

                    👤

                    </div>

                    `;

                }


                box.innerHTML=`

                    ${photoHTML}

                    <div class="personGender">
                    ${p.gender==="male" ? "👨" : p.gender==="female" ? "👩" : "👤"}
                    </div>

                    <div
                    class="personName">

                    ${safe(
                        fullName(p)
                    )}

                    </div>

                    <div
                    class="dates">

                    ${safe(
                        p.birthDate||"?"
                    )}

                    —

                    ${safe(
                        p.deathDate||""
                    )}

                    </div>

                    <div class="personAge">
                    ${safe(ageText(p))}
                    </div>

                `;


                tree.appendChild(
                    box
                );

            }
        );

    });


    let treeHeight=
        100+
        (
            maxLevel-minLevel+2
        )*210;


    tree.style.minHeight=
        Math.max(
            1100,
            treeHeight
        )+"px";


    svg.setAttribute(
        "width",
        WIDTH
    );


    svg.setAttribute(
        "height",
        treeHeight
    );


    /*
       V8 ხაზების დახატვა
    */
    const mset=maternalSet(root.id);

    relations.forEach(
        r=>{

            if(
                !positions[r.a] ||
                !positions[r.b]
            )
                return;


            let a=
                positions[r.a];

            let b=
                positions[r.b];


            const lineColor=relationLineColor(r,root.id,mset);
            if(r.type==="მეუღლე") { drawSpouseLine(svg,a,b,W,H); return; }
            if(r.type==="შვილი" || r.type==="ვაჟიშვილი" || r.type==="ქალიშვილი" || r.type==="მამა" || r.type==="დედა" || r.type==="მშობელი") { drawParentLine(svg,a,b,W,H,lineColor); return; }
            drawOtherLine(svg,a,b,W,H,lineColor);

        }
    );

}


/* =====================================================
   SPOUSE LINE
===================================================== */

function drawSpouseLine(
    svg,
    a,
    b,
    W,
    H
){

    let line=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );


    line.setAttribute(
        "x1",
        a.x+W/2
    );


    line.setAttribute(
        "y1",
        a.y+H/2
    );


    line.setAttribute(
        "x2",
        b.x+W/2
    );


    line.setAttribute(
        "y2",
        b.y+H/2
    );


    line.setAttribute(
        "stroke",
        "#2e7d32"
    );


    line.setAttribute(
        "stroke-width",
        "5"
    );


    line.setAttribute(
        "stroke-linecap",
        "round"
    );


    svg.appendChild(
        line
    );

}


/* =====================================================
   PARENT LINE
===================================================== */

function drawParentLine(
    svg,
    a,
    b,
    W,
    H,
    color
){

    let x1=
        a.x+W/2;

    let y1=
        a.y+H;

    let x2=
        b.x+W/2;

    let y2=
        b.y;


    let mid=
        (y1+y2)/2;


    let path=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    path.setAttribute(
        "d",
        `
        M ${x1} ${y1}

        C ${x1} ${mid},
          ${x2} ${mid},
          ${x2} ${y2}
        `
    );


    path.setAttribute(
        "fill",
        "none"
    );


    path.setAttribute(
        "stroke",
        color
    );


    path.setAttribute(
        "stroke-width",
        "4"
    );


    path.setAttribute(
        "stroke-linecap",
        "round"
    );


    svg.appendChild(
        path
    );

}


/* =====================================================
   OTHER LINE
===================================================== */

function drawOtherLine(
    svg,
    a,
    b,
    W,
    H,
    color="#000000"
){

    let line=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );


    line.setAttribute(
        "x1",
        a.x+W/2
    );


    line.setAttribute(
        "y1",
        a.y+H/2
    );


    line.setAttribute(
        "x2",
        b.x+W/2
    );


    line.setAttribute(
        "y2",
        b.y+H/2
    );


    line.setAttribute(
        "stroke",
        color
    );


    line.setAttribute(
        "stroke-width",
        "3"
    );


    line.setAttribute(
        "stroke-linecap",
        "round"
    );


    svg.appendChild(
        line
    );

}

/* =====================================================
   CLOSE MENUS
===================================================== */

        document.getElementById(
            "contextMenu"
        );


    if(menu)
        menu.remove();

}


document.addEventListener(
    "click",
    closeMenus
);


/* =====================================================
   V8 PROFESSIONAL HELPERS
===================================================== */
function relationTargets(pid){
    let out=[];
    relations.forEach(r=>{
        if(r.a===pid) out.push({id:r.b,type:r.type});
        else if(r.b===pid) out.push({id:r.a,type:reverseRelationType(r.type)});
    });
    const seen=new Set();
    return out.filter(x=>{if(seen.has(x.id)) return false; seen.add(x.id); return true;});
}
function reverseRelationType(t){
    const m={"მამა":"შვილი","დედა":"შვილი","შვილი":"მშობელი","ვაჟიშვილი":"მშობელი","ქალიშვილი":"მშობელი","მეუღლე":"მეუღლე","პაპა":"შვილიშვილი","ბებია":"შვილიშვილი","შვილიშვილი":"პაპა","ძმა":"ძმა","და":"და","ბიძა":"ძმისშვილი","დეიდა":"დისშვილი","ბიძაშვილი":"ბიძაშვილი","მშობელი":"შვილი"};
    return m[t]||t||"ნათესავი";
}
function relationIcon(type){
    if(type==='მეუღლე') return '💍';
    if(type==='ძმა'||type==='და') return '🔵';
    if(type==='მამა'||type==='დედა'||type==='მშობელი') return '👨‍👩‍👧';
    if(type==='შვილი'||type==='ვაჟიშვილი'||type==='ქალიშვილი') return '👶';
    if(type==='პაპა'||type==='ბებია') return '👴';
    if(type==='შვილიშვილი') return '🧒';
    return '👪';
}
function statusText(p){
    if(!p) return 'უცნობია';
    if(p.deathDate){
        const age=calculateAge(p.birthDate,p.deathDate);
        return age===null ? '🕯️ გარდაცვლილი' : '🕯️ გარდაცვლილი · '+age+' წლის';
    }
    const age=calculateAge(p.birthDate,null);
    return age===null ? '🟢 ცოცხალი' : '🟢 ცოცხალი · '+age+' წლის';
}
function statusClass(p){return p&&p.deathDate?'dead':(p&&p.birthDate?'alive':'unknown');}
function maternalSet(rootId){
    const set=new Set();
    const q=[];
    const motherRelations=relations.filter(r=>r.a===rootId && r.type==='დედა');
    motherRelations.forEach(r=>q.push(r.b));
    // compatibility: mother may be stored as parent->child only
    relations.filter(r=>r.b===rootId && r.type==='შვილი' && getPerson(r.a)?.gender==='female').forEach(r=>q.push(r.a));
    while(q.length){
        const id=q.shift(); if(!id||set.has(id)) continue; set.add(id);
        relations.forEach(r=>{
            if(r.a===id && (r.type==='მამა'||r.type==='დედა')) q.push(r.b);
            else if(r.b===id && (r.type==='შვილი'||r.type==='ვაჟიშვილი'||r.type==='ქალიშვილი')) q.push(r.a);
        });
    }
    return set;
}
function relationLineColor(r,rootId,mset){
    if(r.type==='მეუღლე') return '#2e7d32';
    if(r.type==='ძმა'||r.type==='და') return '#1565c0';
    if(r.type==='შვილი'||r.type==='ვაჟიშვილი'||r.type==='ქალიშვილი'||r.type==='მამა'||r.type==='დედა'||r.type==='მშობელი') return '#c62828';
    if(mset.has(r.a)||mset.has(r.b)) return '#6d4c41';
    return '#000000';
}
function updateV8Stats(){
    const el=document.getElementById('v8Stats'); if(!el) return;
    const alive=people.filter(p=>!p.deathDate).length;
    const dead=people.filter(p=>!!p.deathDate).length;
    const photos=people.reduce((n,p)=>n+(Array.isArray(p.photos)?p.photos.length:(p.photo?1:0)),0);
    el.innerHTML=`<div class="v8Stat"><b>${people.length}</b><span>👥 ოჯახის წევრი</span></div><div class="v8Stat"><b>${alive}</b><span>🟢 ცოცხალი</span></div><div class="v8Stat"><b>${dead}</b><span>🕯️ გარდაცვლილი</span></div><div class="v8Stat"><b>${photos}</b><span>📷 ყველა ფოტო</span></div>`;
}
function collectAllRelatives(rootId){
    const result=[]; const visited=new Set([rootId]); const q=[{id:rootId,path:[]}];
    while(q.length){
        const cur=q.shift();
        relationTargets(cur.id).forEach(e=>{
            if(!getPerson(e.id)||visited.has(e.id)) return;
            visited.add(e.id);
            const path=cur.path.concat([e.type]);
            result.push({person:getPerson(e.id),path});
            q.push({id:e.id,path});
        });
    }
    return result;
}
function relationPathText(path){
    if(!path.length) return 'თავად';
    const direct=path[0];
    if(path.length===1) return direct;
    const patterns={
      'მშობელი|ძმა':'ბიძა / დეიდა',
      'მშობელი|და':'ბიძა / დეიდა',
      'მშობელი|შვილი':'ბიძაშვილი',
      'შვილი|მშობელი':'შვილიშვილი',
      'შვილი|ძმა':'დისშვილი / ძმისშვილი',
      'შვილი|და':'დისშვილი / ძმისშვილი',
      'მშობელი|მშობელი':'ბებია / პაპა',
      'შვილი|შვილი':'შვილიშვილი',
      'მეუღლე|მშობელი':'მეუღლის მშობელი',
      'მეუღლე|შვილი':'გერი / ოჯახის შვილი'
    };
    const key=path.slice(0,2).join('|');
    return patterns[key] || path.join(' → ');
}
function relativeRowHTML(x){
    const p=x.person; const path=relationPathText(x.path);
    const first=x.path[0]||'';
    const badgeClass=first==='ძმა'||first==='და'?'sibling':first==='მეუღლე'?'spouse':(first==='მამა'||first==='დედა'||first==='მშობელი')?'parent':'';
    const avatar=p.photo?`<img class="relationAvatar" src="${p.photo}">`:`<div class="relationAvatar">${p.gender==='male'?'👨':p.gender==='female'?'👩':'👤'}</div>`;
    const age=calculateAge(p.birthDate,p.deathDate||null);
    const ageTextV=age===null?'ასაკი უცნობია':(p.deathDate?'გარდაცვალების ასაკი: '+age+' წელი':'ასაკი: '+age+' წელი');
    return `<div class="allRelativeRow">${avatar}<div><div class="relationName">${safe(fullName(p))}</div><div class="relationInfo">${safe(path)}</div></div><div><span class="badge ${badgeClass}">${relationIcon(first)} ${safe(path)}</span><div class="relationInfo">${safe(p.birthDate||'დაბადება უცნობია')}</div></div><div class="relationStatus ${statusClass(p)}">${safe(statusText(p))}<br><span class="small">${safe(ageTextV)}</span></div></div>`;
}

function safe(value){

        value||""

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


function attr(value){

}

/* =====================================================
   V9 PHOTO ALBUM EXTENSION — CHILDHOOD / HISTORICAL PHOTOS
   Stores multiple compressed photos per person in localStorage.
===================================================== */
(function(){
    function ensureAlbums(){
        if(!Array.isArray(people)) return;
        people.forEach(function(p){
            if(!p || typeof p!=='object') return;
            if(!Array.isArray(p.photos)) p.photos=[];
            /* Migrate the existing main photo into the album once. */
            if(p.photo && !p.photos.some(function(x){return x && x.src===p.photo;})){
                p.photos.unshift({src:p.photo, label:'ძირითადი ფოტო', date:''});
            }
        });
    }

    function compressImage(file, callback){
        if(!file){ callback(null); return; }
        if(!file.type || file.type.indexOf('image/')!==0){
            alert('გთხოვთ აირჩიოთ სურათის ფაილი.'); callback(null); return;
        }
        var reader=new FileReader();
        reader.onload=function(e){
            var img=new Image();
            img.onload=function(){
                var max=1400, scale=Math.min(1,max/Math.max(img.width,img.height));
                var w=Math.max(1,Math.round(img.width*scale));
                var h=Math.max(1,Math.round(img.height*scale));
                var c=document.createElement('canvas'); c.width=w; c.height=h;
                var ctx=c.getContext('2d');
                ctx.drawImage(img,0,0,w,h);
                callback(c.toDataURL('image/jpeg',0.78));
            };
            img.onerror=function(){ callback(e.target.result); };
            img.src=e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function albumFor(pid){
        ensureAlbums();
        var p=getPerson(pid);
        return p && Array.isArray(p.photos) ? p.photos : [];
    }

    window.addHistoricalPhotos=function(pid){
        var p=getPerson(pid); if(!p) return;
        ensureAlbums();
        var input=document.createElement('input');
        input.type='file'; input.accept='image/*'; input.multiple=true;
        input.onchange=function(){
            var files=Array.from(input.files||[]);
            if(!files.length) return;
            var label=prompt('ფოტოების აღწერა (მაგ. ბავშვობა, სკოლა, ქორწილი):','ისტორიული ფოტო');
            if(label===null) return;
            var year=prompt('ფოტოს წელი (არასავალდებულო):','');
            if(year===null) return;
            year=String(year).trim();
            if(year && !/^\d{4}$/.test(year)){
                alert('წელი უნდა იყოს 4 ციფრი, მაგალითად 1975.'); return;
            }
            var photoAge=prompt('ადამიანის ასაკი ფოტოზე (არასავალდებულო):','');
            if(photoAge===null) return;
            photoAge=String(photoAge).trim();
            var done=0, added=0;
            var add=function(file){
                compressImage(file,function(src){
                    if(src){
                        p.photos.push({
                            src:src,
                            label:label || file.name.replace(/\.[^.]+$/,''),
                            date:year || new Date().toLocaleDateString('ka-GE'),
                            age:photoAge
                        });
                        added++;
                    }
                    done++;
                    if(done===files.length){
                        if(!p.photo && p.photos[0]) p.photo=p.photos[0].src;
                        try{
                            saveData();
                            renderTree();
                            showPersonAlbum(pid);
                        }catch(e){
                            alert('სურათების შენახვა ვერ მოხერხდა. სცადეთ ნაკლები ან უფრო პატარა ფოტოები.');
                        }
                    }
                });
            };
            files.forEach(add);
        };
        input.click();
    };

    window.showPersonAlbum=function(pid){
        var p=getPerson(pid); if(!p) return;
        ensureAlbums();
        var back=createModal(), modal=back.querySelector('.modal'); if(!modal) return;
        var photos=(p.photos||[]).slice().sort(function(a,b){
            var ay=/^\d{4}$/.test(String(a.date||''))?Number(a.date):9999;
            var by=/^\d{4}$/.test(String(b.date||''))?Number(b.date):9999;
            return ay-by;
        });
        modal.innerHTML='<button class="v8Close" onclick="closeModal()">✕</button>'+
            '<h2>📷 ფოტოალბომი — '+safe(fullName(p))+'</h2>'+ 
            '<div class="hint">ბავშვობის, ახალგაზრდობის და სხვა ისტორიული ფოტოები · '+photos.length+' ფოტო</div>'+ 
            '<div class="profileAlbumGrid" id="personAlbumGrid"></div><br>'+ 
            '<button class="blue" onclick="addHistoricalPhotos(\''+safe(p.id)+'\')">➕ ფოტოების დამატება</button> '+
            '<button onclick="viewProfile(\''+safe(p.id)+'\')">👤 პროფილი</button> '+
            '<button onclick="closeModal()">დახურვა</button>';
        var grid=document.getElementById('personAlbumGrid');
        if(!photos.length){grid.innerHTML='<div class="galleryEmpty">📷 ამ ადამიანის ალბომში ფოტოები ჯერ არ არის.</div>';return;}
        photos.forEach(function(ph,i){
            if(!ph || !ph.src) return;
            var realIndex=p.photos.indexOf(ph);
            var card=document.createElement('div'); card.className='profileAlbumCard';
            var meta=(ph.date||'')+(ph.age?(' · ასაკი '+ph.age):'');
            card.innerHTML='<img src="'+safe(ph.src)+'" alt=""><div class="galleryName">'+safe(ph.label||('ფოტო '+(i+1)))+'</div><div class="galleryDates">'+safe(meta)+'</div>'+ 
                '<button class="red albumDelete" type="button">🗑️ წაშლა</button>';
            card.querySelector('.albumDelete').onclick=function(ev){
                ev.stopPropagation();
                if(confirm('ეს ფოტო წაიშალოს ალბომიდან?')){
                    p.photos.splice(realIndex,1);
                    if(p.photo===ph.src)p.photo=p.photos[0]?p.photos[0].src:'';
                    saveData(); renderTree(); showPersonAlbum(pid);
                }
            };
            card.querySelector('img').onclick=function(){showPhotoLightbox(ph.src,fullName(p),ph.label||'',ph.date||'',ph.age||'');};
            grid.appendChild(card);
        });
    };

    window.showPhotoLightbox=function(src,name,label,date,age){
        var back=createModal(), modal=back.querySelector('.modal'); if(!modal)return;
        modal.innerHTML='<button class="v8Close" onclick="closeModal()">✕</button><h2>📷 '+safe(name)+'</h2>'+ 
            '<div class="lightboxPhoto"><img src="'+safe(src)+'" alt=""></div>'+ 
            '<div class="hint">'+safe(label||'')+(date?' · '+safe(date):'')+(age?' · ასაკი '+safe(age):'')+'</div>'+ 
            '<button class="blue" id="downloadPhotoBtn">⬇️ ფოტოს შენახვა</button> <button onclick="closeModal()">დახურვა</button>';
        var btn=document.getElementById('downloadPhotoBtn');
        if(btn) btn.onclick=function(){downloadFamilyPhoto(src,name);};
    };

    /* Replace the simple gallery with an album-aware gallery. */
    window.photoGallery=function(){
        try{
            ensureAlbums(); closeMenus();
            var back=createModal(), modal=back.querySelector('.modal'); if(!modal)return;
            modal.innerHTML='<button class="v8Close" onclick="closeModal()">✕</button><h2>📷 ოჯახის ფოტო გალერეა</h2>'+ 
                '<div class="hint">ყველა ოჯახის წევრის ფოტო, მათ შორის ბავშვობისა და ძველი ფოტოები</div>'+ 
                '<div class="galleryGrid" id="allPhotoGallery"></div><br><button onclick="closeModal()">დახურვა</button>';
            var grid=document.getElementById('allPhotoGallery'), count=0;
            people.forEach(function(p){
                (p.photos||[]).forEach(function(ph,i){
                    if(!ph || !ph.src)return; count++;
                    var card=document.createElement('div');card.className='galleryCard';
                    card.innerHTML='<img class="galleryImg" src="'+safe(ph.src)+'" alt=""><div class="galleryName">'+safe(fullName(p))+'</div><div class="galleryDates">'+safe(ph.label||('ფოტო '+(i+1)))+' '+safe(ph.date||'')+'</div>';
                    card.onclick=function(){showPhotoLightbox(ph.src,fullName(p),ph.label||'',ph.date||'',ph.age||'');};
                    grid.appendChild(card);
                });
            });
            if(!count)grid.innerHTML='<div class="galleryEmpty">📷 ჯერ არც ერთი ოჯახის წევრის ფოტო არ არის დამატებული.</div>';
        }catch(err){console.error(err);alert('სურათების გალერეის გახსნისას მოხდა შეცდომა.');}
    };

    /* After View Profile opens, add the person's album without disturbing the existing profile. */
    var originalViewProfile=window.viewProfile;
    window.viewProfile=function(pid){
        originalViewProfile(pid);
        setTimeout(function(){
            try{
                ensureAlbums();
                var p=getPerson(pid); if(!p)return;
                var modal=document.querySelector('.modalBack .modal')||document.querySelector('.modal');
                if(!modal)return;
                if(modal.querySelector('.profileAlbumSection'))return;
                var photos=p.photos||[];
                var sec=document.createElement('div'); sec.className='relationBox profileAlbumSection';
                sec.innerHTML='<b>📷 ფოტოალბომი · '+photos.length+' ფოტო</b><div class="hint">შეინახე ამ ადამიანის ბავშვობის, ახალგაზრდობის და სხვა წლების ფოტოები.</div><div class="miniAlbum" id="miniAlbum"></div><button class="blue" type="button">➕ ფოტოების დამატება</button> <button type="button">🖼️ მთელი ალბომის ნახვა</button>';
                var buttons=sec.querySelectorAll('button');
                buttons[0].onclick=function(){addHistoricalPhotos(pid);};
                buttons[1].onclick=function(){showPersonAlbum(pid);};
                var mini=sec.querySelector('#miniAlbum');
                photos.slice(0,8).forEach(function(ph,i){if(!ph||!ph.src)return;var im=document.createElement('img');im.src=ph.src;im.title=ph.label||('ფოტო '+(i+1));im.onclick=function(){showPhotoLightbox(ph.src,fullName(p),ph.label||'',ph.date||'',ph.age||'');};mini.appendChild(im);});
                if(!photos.length)mini.innerHTML='<div class="small">ფოტოები ჯერ არ არის დამატებული.</div>';
                modal.appendChild(sec);
            }catch(e){console.error('Album profile extension:',e);}
        },50);
    };

    window.downloadFamilyPhoto=function(src,name){
        try{
            var a=document.createElement('a');
            a.href=src;
            a.download=(String(name||'family_photo').replace(/[^\w\-ა-ჰ]+/g,'_')||'family_photo')+'.jpg';
            document.body.appendChild(a); a.click(); a.remove();
        }catch(e){ alert('ფოტოს შენახვა ვერ მოხერხდა.'); }
    };

    window.verifyFamilyData=function(){
        var badPeople=0, badRelations=0, duplicateIds=0, ids=new Set();
        people.forEach(function(p){
            if(!p || !p.id || !p.firstName) badPeople++;
            if(p && p.id){ if(ids.has(p.id)) duplicateIds++; ids.add(p.id); }
            if(p && !Array.isArray(p.photos)) p.photos=[];
        });
        relations.forEach(function(r){
            if(!r || !getPerson(r.a) || !getPerson(r.b)) badRelations++;
        });
        ensureAlbums();
        try{saveData();}catch(e){}
        if(!badPeople && !badRelations && !duplicateIds){
            alert('✅ მონაცემთა შემოწმება დასრულდა.\n\nყველა ოჯახის წევრი, კავშირი და ფოტოალბომი წესრიგშია.');
        }else{
            alert('⚠️ შემოწმების შედეგი:\n\nარასწორი წევრები: '+badPeople+'\nარასწორი კავშირები: '+badRelations+'\nდუბლირებული ID: '+duplicateIds+'\n\nფოტოალბომების სტრუქტურა ავტომატურად მოწესრიგდა.');
            renderTree();
        }
    };

    ensureAlbums();
    try{saveData();}catch(e){ console.warn('Initial save skipped:',e); }
})();

</script>


<script>
/* ========================= FAMILY TREE V11 SOCIAL LAYER ========================= */
(function(){
  const POST_KEY='familyTreeV11_posts';
  const NOTIF_KEY='familyTreeV11_notifications';
  function posts(){try{return JSON.parse(localStorage.getItem(POST_KEY)||'[]')}catch(e){return[]}}
  function savePosts(x){localStorage.setItem(POST_KEY,JSON.stringify(x))}
  function notifs(){try{return JSON.parse(localStorage.getItem(NOTIF_KEY)||'[]')}catch(e){return[]}}
  function saveNotifs(x){localStorage.setItem(NOTIF_KEY,JSON.stringify(x))}
  function esc(x){return String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
  function modal(title,html){var b=createModal(),m=b.querySelector('.modal');m.innerHTML='<button class="v8Close" onclick="closeModal()">✕</button><h2>'+title+'</h2>'+html;return m}
  function avatar(p,cls='postAvatar'){return p&&p.photo?'<img class="'+cls+'" src="'+esc(p.photo)+'">':'<div class="'+cls+'">'+(p&&p.gender==='მდედრობითი'?'👩':'👤')+'</div>'}
  function currentPerson(){return getPerson(selectedPerson)||people[0]}
  function addNotification(text){var n=notifs();n.unshift({id:makeId(),text,date:new Date().toLocaleString('ka-GE'),read:false});saveNotifs(n.slice(0,100));updateNotifCount()}
  function updateNotifCount(){var n=notifs().filter(x=>!x.read).length;var el=document.getElementById('notifCount');if(el)el.textContent=n?'('+n+')':''}
  window.familyHome=function(){
    var alive=people.filter(p=>!p.deathDate).length,dead=people.length-alive,photos=people.reduce((a,p)=>a+(p.photos||[]).length,0),ps=posts();
    var m=modal('🏠 Family Home','<div class="v11dash">'+
      '<div class="v11card"><div class="v11big">'+people.length+'</div><div class="v11muted">Family Members</div></div>'+
      '<div class="v11card"><div class="v11big">'+alive+'</div><div class="v11muted">Living Members</div></div>'+
      '<div class="v11card"><div class="v11big">'+dead+'</div><div class="v11muted">Memorial Members</div></div>'+
      '<div class="v11card"><div class="v11big">'+photos+'</div><div class="v11muted">Photos</div></div>'+
      '<div class="v11card"><div class="v11big">'+ps.length+'</div><div class="v11muted">Family Posts</div></div></div>'+
      '<div class="v11card"><h3>🌳 '+esc('ჩვენი ოჯახი')+'</h3><p>ეს არის V11-ის ონლაინ სოციალური ოჯახის სივრცე. ამ ერთფაილიან ვერსიაში მონაცემები ინახება ამ ბრაუზერში; ონლაინ მრავალმომხმარებლიანი რეჟიმისთვის მოგვიანებით შეიძლება დაემატოს სერვერი/Cloud Database.</p><button class="green" onclick="familyFeed()">📰 Family Feed</button> <button onclick="closeModal()">🌳 Family Tree</button></div>');
  };
  window.familyFeed=function(){
    var ps=posts();
    var html='<div class="v11card"><h3>✍️ New Family Post</h3><textarea id="newPostText" placeholder="რას გაუზიარებდით ოჯახს?"></textarea><label>📷 ფოტო (სურვილისამებრ)</label><input id="newPostPhoto" type="file" accept="image/*"><button class="green" onclick="createFamilyPost()">Publish</button></div><div class="v11feed" id="v11Feed">';
    if(!ps.length)html+='<div class="v11empty">📰 ჯერ პოსტები არ არის. შექმენი პირველი საოჯახო პოსტი.</div>';
    ps.forEach((p,i)=>{var author=getPerson(p.authorId)||currentPerson();html+='<article class="post"><div class="postHead">'+avatar(author)+'<div><b>'+esc(fullName(author)||'Family Member')+'</b><div class="v11muted">'+esc(p.date)+'</div></div></div><div class="postText">'+esc(p.text).replace(/\n/g,'<br>')+'</div>'+(p.photo?'<img class="postImg" src="'+esc(p.photo)+'">':'')+'<div class="postActions"><button onclick="likeFamilyPost(\''+p.id+'\')">❤️ '+(p.likes||0)+'</button><button onclick="commentFamilyPost(\''+p.id+'\')">💬 '+((p.comments||[]).length)+'</button></div>'+((p.comments||[]).map(c=>'<div class="comment"><b>'+esc(c.author||'Family Member')+':</b> '+esc(c.text)+'</div>').join(''))+'</article>'});
    html+='</div>';modal('📰 Family Feed',html);
  };
  window.createFamilyPost=function(){var text=document.getElementById('newPostText')?.value.trim();if(!text){alert('გთხოვთ დაწეროთ პოსტი.');return}var f=document.getElementById('newPostPhoto')?.files?.[0];var p={id:makeId(),authorId:(currentPerson()||{}).id,text,date:new Date().toLocaleString('ka-GE'),likes:0,comments:[],photo:''};function finish(src){p.photo=src;var a=posts();a.unshift(p);savePosts(a);addNotification((currentPerson()?.firstName||'Family Member')+'-მა შექმნა ახალი პოსტი.');familyFeed()}if(f){var r=new FileReader();r.onload=e=>finish(e.target.result);r.readAsDataURL(f)}else finish('')};
  window.likeFamilyPost=function(id){var a=posts(),p=a.find(x=>x.id===id);if(!p)return;p.likes=(p.likes||0)+1;savePosts(a);familyFeed()};
  window.commentFamilyPost=function(id){var t=prompt('დაწერე კომენტარი:');if(!t)return;var a=posts(),p=a.find(x=>x.id===id);if(!p)return;p.comments=p.comments||[];p.comments.push({author:fullName(currentPerson())||'Family Member',text:t});savePosts(a);addNotification((currentPerson()?.firstName||'Family Member')+'-მა კომენტარი დაამატა.');familyFeed()};
  window.familyMembersV11=function(){var html='<div class="v11card"><input id="memberFilter" placeholder="🔎 წევრის ძებნა..." oninput="filterV11Members()"><div id="v11Members"></div></div>';var m=modal('👥 Family Members',html);renderV11Members();};
  window.renderV11Members=function(){var q=(document.getElementById('memberFilter')?.value||'').toLowerCase();var arr=people.filter(p=>fullName(p).toLowerCase().includes(q));var box=document.getElementById('v11Members');if(!box)return;box.innerHTML='<table class="v11table"><tr><th>Member</th><th>Age</th><th>Status</th><th></th></tr>'+arr.map(p=>'<tr><td><b>'+esc(fullName(p))+'</b></td><td>'+esc(ageText(p).replace('დღევანდელი ასაკ: ','').replace('გარდაცვალების ასაკი: ','').replace('ასაკი: ',''))+'</td><td><span class="v11badge '+(p.deathDate?'v11dead':'v11alive')+'">'+(p.deathDate?'🕯️ გარდაცვლილი':'🟢 ცოცხალი')+'</span></td><td><button onclick="viewProfile(\''+p.id+'\')">View Profile</button></td></tr>').join('')+'</table>'};
  window.filterV11Members=window.renderV11Members;
  window.familyBirthdays=function(){var now=new Date(),rows=[];people.forEach(p=>{if(!p.birthDate)return;var d=parseDateValue(p.birthDate);if(!d)return;var next=new Date(now.getFullYear(),d.getMonth(),d.getDate());if(next<new Date(now.getFullYear(),now.getMonth(),now.getDate()))next.setFullYear(now.getFullYear()+1);rows.push({p,next})});rows.sort((a,b)=>a.next-b.next);var h='<div class="v11card">';rows.slice(0,20).forEach(x=>{var p=x.p,age=calculateAge(p.birthDate,new Date(x.next.getFullYear(),x.next.getMonth(),x.next.getDate()));h+='<div class="relationItem"><b>🎂 '+esc(fullName(p))+'</b> — '+x.next.toLocaleDateString('ka-GE')+' <span class="small">('+age+' წელი გახდება)</span></div>'});if(!rows.length)h+='<div class="v11empty">დაბადების თარიღები არ არის.</div>';h+='</div>';modal('🎂 Family Birthdays',h)};
  window.familyHistoryV11=function(){var arr=people.filter(p=>p.birthDate).map(p=>({p,d:parseDateValue(p.birthDate)})).sort((a,b)=>a.d-b.d);var h='<div class="v11card"><h3>📖 Family History Timeline</h3><div class="v11timeline">';arr.forEach(x=>{h+='<div class="v11event"><b>'+x.d.getFullYear()+'</b> — '+esc(fullName(x.p))+' დაიბადა'+(x.p.birthPlace?' · '+esc(x.p.birthPlace):'')+(x.p.deathDate?' 🕯️':'')+'</div>'});h+='</div></div>';modal('📖 Family History',h)};
  window.familyNotifications=function(){var n=notifs();var h='<div class="v11card">';if(!n.length)h+='<div class="v11empty">🔔 შეტყობინებები არ არის.</div>';n.forEach(x=>{h+='<div class="relationItem"><b>'+esc(x.text)+'</b><div class="small">'+esc(x.date)+'</div></div>';x.read=true});h+='</div>';saveNotifs(n);modal('🔔 Notifications',h);updateNotifCount()};
  window.v11SearchFamily=function(q){return people.filter(p=>fullName(p).toLowerCase().includes(String(q||'').toLowerCase()))};
  document.addEventListener('DOMContentLoaded',updateNotifCount);setTimeout(updateNotifCount,300);
})();
</script>
